<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LC Deals - Deku Deals BR Multi-Loja</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; }
    .store-badge { font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- TOPBAR ESTILO DEKU DEALS -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
      
      <!-- LOGO + CONTADORES DE COLEÇÃO E WISHLIST -->
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-md shadow-indigo-500/20">
            <i class="fa-solid fa-tags text-xl"></i>
          </div>
          <div>
            <h1 class="font-extrabold text-lg tracking-tight flex items-center gap-2">
              LC Deals <span class="text-[11px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full">BR Edition</span>
            </h1>
            <p class="text-xs text-slate-400">Switch • Xbox • PS • PC • Gift Cards • Jogos Grátis</p>
          </div>
        </div>

        <!-- BOTÕES DE WISHLIST E COLEÇÃO (ESTILO DEKU DEALS) -->
        <div class="flex items-center gap-2">
          <button onclick="setCategory('wishlist')" id="cat-wishlist" class="cat-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-heart text-rose-500"></i>
            <span class="hidden sm:inline">Wishlist</span>
            <span id="wishCount" class="bg-rose-500/20 text-rose-300 px-1.5 py-0.2 rounded text-[11px]">0</span>
          </button>
          <button onclick="setCategory('collection')" id="cat-collection" class="cat-btn bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-gamepad text-emerald-400"></i>
            <span class="hidden sm:inline">Coleção</span>
            <span id="collCount" class="bg-emerald-500/20 text-emerald-300 px-1.5 py-0.2 rounded text-[11px]">0</span>
          </button>
        </div>
      </div>

      <!-- BUSCA + FILTROS RÁPIDOS DE ORDENAÇÃO -->
      <div class="flex flex-wrap sm:flex-nowrap items-center gap-2 flex-1 max-w-2xl">
        <div class="relative w-full">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input id="searchInput" oninput="renderDeals()" type="text" placeholder="Buscar jogo, série ou Gift Card (ex: Zelda, eShop, Hollow Knight, Xbox)..." 
            class="w-full bg-slate-950 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <select id="sortSelect" onchange="renderDeals()" class="bg-slate-800 border border-slate-700 text-xs font-medium rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none">
          <option value="discount_desc">🔥 Maior Desconto (%)</option>
          <option value="price_asc">💰 Menor Preço (R$)</option>
          <option value="lowest_first">📉 Menor Histórico Primeiro</option>
          <option value="title_asc">🔤 Ordem Alfabética (A-Z)</option>
        </select>

        <button onclick="loadAllSources()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl flex items-center gap-1.5 shrink-0 transition">
          <i class="fa-solid fa-rotate"></i> Atualizar
        </button>
      </div>
    </div>

    <!-- NAVEGAÇÃO ESTILO DEKU DEALS (CATEGORIAS + TETO DE PREÇO) -->
    <div class="max-w-7xl mx-auto px-4 py-2 border-t border-slate-800/80 flex flex-wrap items-center justify-between gap-2">
      <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
        <button onclick="setCategory('all')" id="cat-all" class="cat-btn bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0">
          <i class="fa-solid fa-fire mr-1"></i> Hottest Deals (Tudo)
        </button>
        <button onclick="setCategory('free_game')" id="cat-free_game" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0">
          <i class="fa-solid fa-gift text-emerald-400 mr-1"></i> Jogos 100% Grátis
        </button>
        <button onclick="setCategory('gift_card')" id="cat-gift_card" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0">
          <i class="fa-solid fa-credit-card text-amber-400 mr-1"></i> Gift Cards & Saldo
        </button>
        <button onclick="setCategory('lowest')" id="cat-lowest" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0">
          <i class="fa-solid fa-arrow-trend-down text-rose-400 mr-1"></i> Menor Preço Histórico
        </button>
        <button onclick="setCategory('under25')" id="cat-under25" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0">
          🪙 Até R$ 25
        </button>
        <button onclick="setCategory('under50')" id="cat-under50" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0">
          💵 Até R$ 50
        </button>
        <button onclick="setCategory('bundle')" id="cat-bundle" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-xs font-semibold shrink-0">
          <i class="fa-solid fa-boxes-stacked text-purple-400 mr-1"></i> Bundles
        </button>
      </div>

      <!-- OPÇÃO DE OCULTAR JOGOS QUE JÁ TEM NA COLEÇÃO -->
      <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer select-none">
        <input type="checkbox" id="hideOwnedToggle" onchange="renderDeals()" class="rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-0">
        <span>Ocultar jogos que já tenho</span>
      </label>
    </div>

    <!-- BARRA DAS 8 LOJAS -->
    <div class="max-w-7xl mx-auto px-4 py-2 bg-slate-950/60 border-t border-slate-800/60 flex gap-1.5 overflow-x-auto no-scrollbar">
      <button onclick="setStore('all')" id="store-all" class="store-btn bg-slate-700 text-white px-3 py-1 rounded-md text-xs font-bold shrink-0">Todas as 8 Lojas</button>
      <button onclick="setStore('ntdeals')" id="store-ntdeals" class="store-btn bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1 rounded-md text-xs font-medium shrink-0">🔴 Switch (NTDeals / eShop)</button>
      <button onclick="setStore('xbdeals')" id="store-xbdeals" class="store-btn bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1 rounded-md text-xs font-medium shrink-0">🟢 Xbox (XBDeals)</button>
      <button onclick="setStore('psdeals')" id="store-psdeals" class="store-btn bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1 rounded-md text-xs font-medium shrink-0">🔵 PlayStation (PSDeals)</button>
      <button onclick="setStore('epic')" id="store-epic" class="store-btn bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1 rounded-md text-xs font-medium shrink-0">⚫ Epic Games</button>
      <button onclick="setStore('steam')" id="store-steam" class="store-btn bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1 rounded-md text-xs font-medium shrink-0">💠 Steam BR</button>
      <button onclick="setStore('nuuvem')" id="store-nuuvem" class="store-btn bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1 rounded-md text-xs font-medium shrink-0">☁️ Nuuvem</button>
      <button onclick="setStore('instant_gaming')" id="store-instant_gaming" class="store-btn bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1 rounded-md text-xs font-medium shrink-0">🟠 Instant Gaming</button>
      <button onclick="setStore('humble')" id="store-humble" class="store-btn bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1 rounded-md text-xs font-medium shrink-0">📕 Humble Bundle</button>
    </div>
  </header>

  <!-- STATUS E LISTAGEM -->
  <main class="max-w-7xl mx-auto px-4 mt-5">
    <div id="statusBanner" class="mb-4 bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-300">
      <span id="statusText"><i class="fa-solid fa-circle-notch fa-spin text-indigo-400 mr-1.5"></i> Carregando catálogo das 8 lojas...</span>
      <span id="itemCount" class="font-bold text-indigo-400">0 ofertas</span>
    </div>

    <div id="dealsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
  </main>

  <script>
    // =========================================================================
    // SUAS CHAVES DO SUPABASE
    // =========================================================================
    const SUPABASE_URL = "https://qnejqlblwzwrfvbsvean.supabase.co";
    const SUPABASE_ANON_KEY = "COLE_SUA_CHAVE_ANON_PUBLICA_AQUI"; 

    let currentCategory = 'all';
    let currentStore = 'all';
    let allDeals = [];

    // Sistema de Wishlist e Coleção salvo no navegador (LocalStorage)
    let wishlistIds = new Set(JSON.parse(localStorage.getItem('lc_wishlist') ? localStorage.getItem('lc_wishlist') : '[]'));
    let collectionIds = new Set(JSON.parse(localStorage.getItem('lc_collection') ? localStorage.getItem('lc_collection') : '[]'));

    const storeConfig = {
      ntdeals: { label: 'Switch BR', color: 'bg-red-600 text-white' },
      xbdeals: { label: 'Xbox BR', color: 'bg-emerald-600 text-white' },
      psdeals: { label: 'PS Store BR', color: 'bg-blue-600 text-white' },
      epic: { label: 'Epic Games', color: 'bg-zinc-800 text-white border border-zinc-600' },
      steam: { label: 'Steam BR', color: 'bg-sky-700 text-white' },
      nuuvem: { label: 'Nuuvem', color: 'bg-cyan-600 text-white' },
      instant_gaming: { label: 'Instant Gaming', color: 'bg-orange-600 text-white' },
      humble: { label: 'Humble', color: 'bg-rose-700 text-white' }
    };

    // Catálogo Base de Gift Cards e Console caso o robô ainda esteja processando
    const baseGiftCardsAndConsoles = [
      { id: 'gc-nintendo-100', title: 'Gift Card Digital Nintendo eShop R$ 100 (Parcelado / Cupom)', store: 'nuuvem', platform: 'giftcard', category: 'gift_card', original_price: 100.00, discount_price: 92.00, discount_pct: 8, is_lowest_ever: true, image_url: 'https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=600&q=80', deal_url: 'https://www.nuuvem.com/br-pt/catalog/platforms/nintendo' },
      { id: 'gc-nintendo-250', title: 'Gift Card Digital Nintendo eShop R$ 250 (Especial Jogos Switch)', store: 'nuuvem', platform: 'giftcard', category: 'gift_card', original_price: 250.00, discount_price: 230.00, discount_pct: 8, is_lowest_ever: true, image_url: 'https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?w=600&q=80', deal_url: 'https://www.nuuvem.com/br-pt/catalog/platforms/nintendo' },
      { id: 'gc-xbox-gp', title: 'Cartão Xbox Game Pass Core / Ultimate & Saldo Xbox BR', store: 'instant_gaming', platform: 'giftcard', category: 'gift_card', original_price: 199.90, discount_price: 159.90, discount_pct: 20, is_lowest_ever: true, image_url: 'https://images.unsplash.com/photo-1621259182978-fbf93132d53d?w=600&q=80', deal_url: 'https://www.instant-gaming.com/pt/pesquisar/?q=xbox' },
      { id: 'gc-psn-br', title: 'Gift Card PlayStation Store Brasil (PS4 / PS5) em até 6x', store: 'nuuvem', platform: 'giftcard', category: 'gift_card', original_price: 150.00, discount_price: 139.50, discount_pct: 7, is_lowest_ever: false, image_url: 'https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?w=600&q=80', deal_url: 'https://www.nuuvem.com/br-pt/catalog/platforms/playstation' },
      { id: 'gc-steam-br', title: 'Gift Card Steam Wallet Brasil & Chaves Instant Gaming', store: 'instant_gaming', platform: 'giftcard', category: 'gift_card', original_price: 100.00, discount_price: 88.00, discount_pct: 12, is_lowest_ever: false, image_url: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&q=80', deal_url: 'https://www.instant-gaming.com/pt/' }
    ];

    function updateCounters() {
      document.getElementById('wishCount').innerText = wishlistIds.size;
      document.getElementById('collCount').innerText = collectionIds.size;
      localStorage.setItem('lc_wishlist', JSON.stringify(Array.from(wishlistIds)));
      localStorage.setItem('lc_collection', JSON.stringify(Array.from(collectionIds)));
    }

    function toggleWishlist(event, id) {
      event.preventDefault();
      event.stopPropagation();
      if (wishlistIds.has(id)) wishlistIds.delete(id);
      else wishlistIds.add(id);
      updateCounters();
      renderDeals();
    }

    function toggleCollection(event, id) {
      event.preventDefault();
      event.stopPropagation();
      if (collectionIds.has(id)) collectionIds.delete(id);
      else collectionIds.add(id);
      updateCounters();
      renderDeals();
    }

    async function loadAllSources() {
      updateCounters();
      const statusText = document.getElementById('statusText');
      statusText.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-indigo-400 mr-1.5"></i> Sincronizando banco de dados Supabase e APIs ao vivo...`;

      const map = new Map();
      baseGiftCardsAndConsoles.forEach(item => map.set(item.id, item));

      // 1. Puxa tudo o que o GitHub Actions salvou no Supabase (Até 1000 ofertas)
      try {
        if (SUPABASE_URL && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('COLE_SUA')) {
          const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          const { data, error } = await sb.from('deals').select('*').limit(1000);
          if (!error && Array.isArray(data)) {
            data.forEach(d => map.set(d.id, d));
          }
        }
      } catch (e) {
        console.warn('Aviso Supabase:', e);
      }

      // 2. Complementa em tempo real com API multi-loja (Steam, Humble, Epic/PC)
      try {
        const res = await fetch('https://www.cheapshark.com/api/1.0/deals?storeID=1,11,25&pageSize=60&sortBy=Savings');
        if (res.ok) {
          const live = await res.json();
          live.forEach(d => {
            const storeKey = d.storeID === "1" ? 'steam' : (d.storeID === "11" ? 'humble' : 'epic');
            const id = `${storeKey}-cs-${d.gameID}`;
            if (!map.has(id)) {
              const pct = Math.round(parseFloat(d.savings));
              const saleBRL = +(parseFloat(d.salePrice) * 5.2).toFixed(2);
              const origBRL = +(parseFloat(d.normalPrice) * 5.2).toFixed(2);
              map.set(id, {
                id,
                title: d.title,
                store: storeKey,
                platform: 'pc',
                category: saleBRL === 0 ? 'free_game' : (pct >= 88 && storeKey === 'humble' ? 'bundle' : 'game_deal'),
                original_price: origBRL,
                discount_price: saleBRL,
                discount_pct: pct,
                is_lowest_ever: pct >= 80,
                image_url: d.thumb.replace('capsule_sm_120', 'header'),
                deal_url: d.storeID === "1" 
                  ? `https://store.steampowered.com/app/${d.steamAppID}/?l=portuguese`
                  : `https://www.humblebundle.com/store/search?search=${encodeURIComponent(d.title)}`
              });
            }
          });
        }
      } catch (e) {
        console.warn('Aviso Live API:', e);
      }

      allDeals = Array.from(map.values());
      statusText.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1.5"></i> Catálogo sincronizado (${allDeals.length} itens no total). Use os corações para sua Wishlist!`;
      renderDeals();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-indigo-600', 'text-white');
        btn.classList.add('bg-slate-800', 'text-slate-300');
      });
      const active = document.getElementById(`cat-${cat}`);
      if (active) {
        active.classList.remove('bg-slate-800', 'text-slate-300');
        active.classList.add('bg-indigo-600', 'text-white');
      }
      renderDeals();
    }

    function setStore(store) {
      currentStore = store;
      document.querySelectorAll('.store-btn').forEach(btn => {
        btn.className = "store-btn bg-slate-800/80 text-slate-400 hover:text-white px-3 py-1 rounded-md text-xs font-medium shrink-0";
      });
      const active = document.getElementById(`store-${store}`);
      if (active) {
        active.className = "store-btn bg-indigo-600 text-white px-3 py-1 rounded-md text-xs font-bold shrink-0";
      }
      renderDeals();
    }

    function renderDeals() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortMode = document.getElementById('sortSelect').value;
      const hideOwned = document.getElementById('hideOwnedToggle').checked;
      const grid = document.getElementById('dealsGrid');

      let filtered = allDeals.filter(item => {
        if (hideOwned && collectionIds.has(item.id) && currentCategory !== 'collection') return false;

        const matchSearch = !query ? true : (item.title.toLowerCase().includes(query) ? true : item.store.toLowerCase().includes(query));
        const matchStore = currentStore === 'all' ? true : item.store === currentStore;

        let matchCat = true;
        if (currentCategory === 'wishlist') matchCat = wishlistIds.has(item.id);
        else if (currentCategory === 'collection') matchCat = collectionIds.has(item.id);
        else if (currentCategory === 'lowest') matchCat = Boolean(item.is_lowest_ever);
        else if (currentCategory === 'under25') matchCat = Number(item.discount_price) <= 25;
        else if (currentCategory === 'under50') matchCat = Number(item.discount_price) <= 50;
        else if (currentCategory !== 'all') matchCat = item.category === currentCategory;

        return matchSearch && matchStore && matchCat;
      });

      // Ordenação estilo Deku Deals
      filtered.sort((a, b) => {
        if (sortMode === 'price_asc') return Number(a.discount_price) - Number(b.discount_price);
        if (sortMode === 'lowest_first') return (b.is_lowest_ever ? 1 : 0) - (a.is_lowest_ever ? 1 : 0) ? (b.is_lowest_ever ? 1 : 0) - (a.is_lowest_ever ? 1 : 0) : Number(b.discount_pct) - Number(a.discount_pct);
        if (sortMode === 'title_asc') return a.title.localeCompare(b.title);
        return Number(b.discount_pct) - Number(a.discount_pct);
      });

      document.getElementById('itemCount').innerText = `${filtered.length} ofertas exibidas`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-slate-900/70 border border-slate-800 rounded-2xl p-10 text-center">
            <i class="fa-solid fa-ghost text-3xl text-slate-500 mb-3"></i>
            <p class="text-sm font-semibold text-slate-300">Nenhuma oferta encontrada para este filtro.</p>
            <p class="text-xs text-slate-500 mt-1">Experimente mudar a loja selecionada acima ou limpar a barra de pesquisa.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(deal => {
        const st = storeConfig[deal.store] ? storeConfig[deal.store] : { label: deal.store, color: 'bg-slate-700 text-white' };
        const isFree = Number(deal.discount_price) === 0 ? true : deal.category === 'free_game';
        const inWish = wishlistIds.has(deal.id);
        const inColl = collectionIds.has(deal.id);

        return `
          <div class="group bg-slate-900/90 hover:bg-slate-800/90 border ${inWish ? 'border-rose-500/60' : 'border-slate-800'} hover:border-indigo-500/60 rounded-xl overflow-hidden flex flex-col justify-between transition duration-200 shadow-lg">
            <div>
              <div class="relative h-40 bg-slate-950 overflow-hidden">
                <a href="${deal.deal_url}" target="_blank" rel="noopener">
                  <img src="${deal.image_url}" alt="${deal.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500'">
                </a>
                <span class="store-badge absolute top-2.5 left-2.5 ${st.color} px-2.5 py-0.5 rounded shadow">${st.label}</span>
                
                ${deal.is_lowest_ever ? `<span class="store-badge absolute bottom-2 left-2.5 bg-rose-600 text-white px-2 py-0.5 rounded shadow"><i class="fa-solid fa-fire mr-1"></i>Menor Histórico</span>` : ''}
                
                <span class="absolute top-2.5 right-2.5 bg-emerald-500 text-slate-950 font-extrabold text-xs px-2 py-0.5 rounded shadow">
                  ${isFree ? 'GRÁTIS' : `-${deal.discount_pct}%`}
                </span>

                <!-- BOTÕES DEKU DEALS: WISHLIST E COLEÇÃO -->
                <div class="absolute bottom-2 right-2.5 flex gap-1.5">
                  <button onclick="toggleWishlist(event, '${deal.id}')" title="Adicionar à Wishlist" 
                    class="w-7 h-7 rounded-full flex items-center justify-center backdrop-blur transition ${inWish ? 'bg-rose-600 text-white' : 'bg-slate-900/80 text-slate-300 hover:text-rose-400'}">
                    <i class="fa-solid fa-heart text-xs"></i>
                  </button>
                  <button onclick="toggleCollection(event, '${deal.id}')" title="Marcar na Minha Coleção (Já tenho)" 
                    class="w-7 h-7 rounded-full flex items-center justify-center backdrop-blur transition ${inColl ? 'bg-emerald-600 text-white' : 'bg-slate-900/80 text-slate-300 hover:text-emerald-400'}">
                    <i class="fa-solid fa-gamepad text-xs"></i>
                  </button>
                </div>
              </div>

              <div class="p-3.5">
                <a href="${deal.deal_url}" target="_blank" rel="noopener" class="font-semibold text-sm text-slate-100 line-clamp-2 group-hover:text-indigo-400 transition">
                  ${deal.title}
                </a>
                ${inColl ? `<span class="inline-block mt-1.5 text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-semibold"><i class="fa-solid fa-check mr-1"></i>Na sua Coleção</span>` : ''}
              </div>
            </div>

            <div class="px-3.5 pb-3.5 pt-2.5 border-t border-slate-800/80 flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-500 line-through block">R$ ${Number(deal.original_price).toFixed(2).replace('.', ',')}</span>
                <span class="text-base font-extrabold ${isFree ? 'text-emerald-400' : 'text-white'}">
                  ${isFree ? 'R$ 0,00' : `R$ ${Number(deal.discount_price).toFixed(2).replace('.', ',')}`}
                </span>
              </div>
              <a href="${deal.deal_url}" target="_blank" rel="noopener" class="text-xs bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white px-3 py-1.5 rounded-lg font-semibold transition">
                Ir à Loja <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[10px]"></i>
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    loadAllSources();
  </script>
</body>
</html>
