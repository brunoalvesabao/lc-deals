name: Sincronizar Ofertas das 8 Lojas

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Dependencias e Navegador Anti-Cloudflare
        run: |
          npm init -y
          npm install @supabase/supabase-js cheerio playwright
          npx playwright install chromium
      - name: Rodar Coletor Completo (8 Lojas + Gift Cards)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node sync-deals.mjs
